<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Özür Dilerim ❤️</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at center, #1a103c, #0b061a, #000);
        color: white;
        text-align: center;
        overflow: hidden;
        position: relative;
    }

    /* Arka Plan Parlama Efekti */
    .glow {
        position: absolute;
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(160, 100, 255, 0.25), transparent 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        animation: pulse 4s infinite alternate;
    }

    @keyframes pulse {
        0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
        100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.9; }
    }

    .card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 40px 30px;
        border-radius: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        max-width: 420px;
        width: 90%;
        position: relative;
        z-index: 2;
    }

    h1 {
        font-size: 26px;
        margin-bottom: 15px;
        color: #ff85a2;
        text-shadow: 0 0 10px rgba(255, 133, 162, 0.4);
    }

    p {
        font-size: 16px;
        color: #e0e0e0;
        line-height: 1.5;
        margin-bottom: 35px;
    }

    /* Yan Yana Buton Konteyneri */
    .btn-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        width: 100%;
    }

    button {
        padding: 14px 32px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #yesBtn {
        background: linear-gradient(45deg, #ff758c, #ff7eb3);
        color: white;
        box-shadow: 0 8px 25px rgba(255, 117, 140, 0.4);
    }

    #yesBtn:hover {
        transform: scale(1.08);
    }

    #noBtn {
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        position: relative;
        transition: left 0.2s ease, top 0.2s ease;
    }

    /* Roket Uçuş Efekti */
    .fly-away {
        position: fixed !important;
        animation: rocketFly 1.2s forwards cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    /* Roket Alevi */
    .fly-away::after {
        content: '🚀🔥';
        position: absolute;
        bottom: -30px;
        left: 50%;
        transform: translateX(-50%) rotate(180deg);
        font-size: 22px;
        animation: flame 0.1s infinite alternate;
    }

    @keyframes rocketFly {
        0% { transform: translateY(0) scale(1); }
        20% { transform: translateY(20px) scale(1.1); }
        100% { transform: translateY(-120vh) scale(0.3); opacity: 0; }
    }

    .success-message {
        display: none;
    }

    .success-message h2 {
        font-size: 28px;
        color: #70a1ff;
        margin-bottom: 10px;
    }
</style>
</head>
<body>

<div class="glow"></div>

<div class="card">
    <div id="questionState">
        <h1>Seni Kırdığım İçin Üzgünüm... ❤️</h1>
        <p>Hatamın farkındayım ve bunu telafi etmek istiyorum. Beni affeder misin?</p>
        
        <div class="btn-container">
            <button id="yesBtn" onclick="accept()">Evet ❤️</button>
            <button id="noBtn" onmouseover="handleNo()" onclick="handleNo()">Hayır 💔</button>
        </div>
    </div>

    <div class="success-message" id="successState">
        <h2>Süperrrr! 🎉</h2>
        <p>Söz veriyorum bir daha seni böyle üzmeyeceğim. Gülüşün benim için çok değerli! ❤️</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script>
    let noClickCount = 0;

    function handleNo() {
        const noBtn = document.getElementById('noBtn');

        // 3. Tıklamada Roket Modu
        if (noClickCount >= 2) {
            noBtn.classList.add('fly-away');
            noBtn.onmouseover = null; // Kaçmayı durdur uçsun
            return;
        }

        noClickCount++;

        // Ekranda Rastgele Kaçma
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 60) + 30;
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 60) + 30;

        noBtn.style.position = 'fixed';
        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;
    }

    function accept() {
        document.getElementById('questionState').style.display = 'none';
        document.getElementById('successState').style.display = 'block';

        confetti({
            particleCount: 120,
            spread: 80,
            origin: { y: 0.6 }
        });
    }
</script>

</body>
</html>
