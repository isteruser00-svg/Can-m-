<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Özür Dilerim ❤️</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        color: white;
        text-align: center;
        overflow: hidden;
    }

    .card {
        background: rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        padding: 40px 30px;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        max-width: 400px;
        width: 90%;
        position: relative;
    }

    h1 {
        font-size: 26px;
        margin-bottom: 15px;
        color: #ff758c;
    }

    p {
        font-size: 16px;
        color: #e0e0e0;
        line-height: 1.5;
        margin-bottom: 30px;
    }

    .btn-container {
        display: flex;
        justify-content: center;
        gap: 20px;
        position: relative;
        min-height: 60px;
    }

    button {
        padding: 14px 28px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    #yesBtn {
        background: linear-gradient(45deg, #ff758c, #ff7eb3);
        color: white;
        box-shadow: 0 8px 20px rgba(255, 117, 140, 0.4);
    }

    #yesBtn:hover {
        transform: scale(1.08);
    }

    #noBtn {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        position: absolute;
        right: 20px;
    }

    .success-message {
        display: none;
    }

    .success-message h2 {
        font-size: 28px;
        color: #4facfe;
        margin-bottom: 10px;
    }
</style>
</head>
<body>

<div class="card" id="card">
    <div id="questionState">
        <h1>Seni Kırdığım İçin Üzgünüm... ❤️</h1>
        <p>Hatamın farkındayım ve bunu telafi etmek istiyorum. Beni affeder misin?</p>
        
        <div class="btn-container">
            <button id="yesBtn" onclick="accept()">Evet ❤️</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Hayır 💔</button>
        </div>
    </div>

    <div class="success-message" id="successState">
        <h2>Süperrrr! 🎉</h2>
        <p>Söz veriyorum bir daha seni böyle üzmeyeceğim. Gülüşün benim için çok değerli! ❤️</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script>
    function moveButton() {
        const noBtn = document.getElementById('noBtn');
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 50);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 50);
        
        noBtn.style.position = 'fixed';
        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;
    }

    function accept() {
        document.getElementById('questionState').style.display = 'none';
        document.getElementById('successState').style.display = 'block';

        // Konfeti efekti
        confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 }
        });
    }
</script>

</body>
</html>
